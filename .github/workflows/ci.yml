# Verificação de projeto de estudo: não publica nada
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  raiz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
  realtime-quiz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime-quiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: realtime-quiz/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
